# Copy this to .github/workflows/test.yml in your repo root.
# GitHub only detects workflows in that exact folder — not .github/, not
# workflows/, not .github/workflow/. The path is unforgiving.

name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci, not npm install.
      # npm install may update package-lock.json; npm ci installs the exact
      # locked versions and fails if the lockfile is out of sync. A CI machine
      # should behave identically on every single run.
      - run: npm ci

      - run: npm test -- --coverage

      # No ANTHROPIC_API_KEY here, deliberately — every test mocks the model.
      # If you ever do need a secret, it goes in repo Settings -> Secrets and
      # is referenced as ${{ secrets.ANTHROPIC_API_KEY }}. Never in this file.
